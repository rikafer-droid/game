<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="description" content="Shmup estilo Megamania — nave, hambúrgueres voadores, pixel art 8-bit.">
<title>MEGA MANIA 8-BIT — Shmup Espacial</title>
<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>
<div id="cabinet">
  <div id="hud-top">
    <div class="hud-block">
      <span class="hud-label">SCORE</span>
      <span id="score" class="hud-value">000000</span>
    </div>
    <div class="hud-block center">
      <span class="hud-label">FASE <span id="level">1</span></span>
      <span id="enemy-name" class="hud-value small">HAMBÚRGUERES</span>
    </div>
    <div class="hud-block right">
      <span class="hud-label">HI <span id="hi">000000</span></span>
      <span id="lives" class="hud-value lives">♥♥♥</span>
    </div>
  </div>

  <div id="screen-wrap">
    <canvas id="game" width="480" height="640"></canvas>
    <div id="scanlines"></div>
    <div id="overlay">
      <h1 id="ov-title">MEGA<br>MANIA</h1>
      <p id="ov-sub">HAMBÚRGUERES DO ESPAÇO ATACAM!</p>
      <button id="btn-start">▶ INICIAR</button>
      <p class="hint">Desktop: ← → / A D + ESPAÇO<br>Mobile: arraste ou ◀ ▶ + FIRE</p>
      <button id="btn-mute" class="mini">🔊 SOM: ON</button>
    </div>
  </div>

  <div id="hud-bottom">
    <span class="hud-label">ENERGIA</span>
    <div id="energy-track">
      <div id="energy-fill"></div>
    </div>
  </div>

  <div id="controls">
    <button id="btn-left" class="ctl" aria-label="Esquerda">◀</button>
    <button id="btn-fire" class="ctl fire" aria-label="Atirar">FIRE</button>
    <button id="btn-right" class="ctl" aria-label="Direita">▶</button>
  </div>
</div>

<script src="js/sprites.js"></script>
<script src="js/audio.js"></script>
<script src="js/game.js"></script>
</body>
</html>
